name: Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cmb2:
    name: WordPress + CMB2 2.13.5
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uwordpress -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        run: |
          WP_PATH="$RUNNER_TEMP/wordpress"

          wp core download \
            --path="$WP_PATH" \
            --quiet

          wp config create \
            --path="$WP_PATH" \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check \
            --quiet

          wp core install \
            --path="$WP_PATH" \
            --url=http://localhost \
            --title="CMB2 Jalali Date Integration" \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.com \
            --skip-email \
            --quiet

      - name: Install CMB2 2.13.5
        run: |
          wp plugin install \
            https://downloads.wordpress.org/plugin/cmb2.2.13.5.zip \
            --activate \
            --path="$RUNNER_TEMP/wordpress" \
            --quiet

      - name: Install extension under test
        run: |
          mkdir -p "$RUNNER_TEMP/wordpress/wp-content/plugins/cmb2-jalali-date"

          rsync -a \
            --exclude='.git/' \
            "$GITHUB_WORKSPACE/" \
            "$RUNNER_TEMP/wordpress/wp-content/plugins/cmb2-jalali-date/"

          wp plugin activate cmb2-jalali-date \
            --path="$RUNNER_TEMP/wordpress" \
            --quiet

      - name: Run CMB2 integration smoke test
        run: |
          wp eval-file \
            "$RUNNER_TEMP/wordpress/wp-content/plugins/cmb2-jalali-date/tests/integration/cmb2-smoke.php" \
            --path="$RUNNER_TEMP/wordpress"
